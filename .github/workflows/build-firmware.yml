name: Build & Release Firmware

on:
  push:
    branches: [ main ]
    # Avoid infinite loops when this workflow commits manifest/firmware changes
    paths-ignore:
      - 'manifest.json'
      - 'ota-manifest.json'
      - 'firmware/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # 1) Read old version from manifest.json and compute new version (patch bump)
      - name: Compute version
        id: version
        run: |
          OLD_VERSION=$(jq -r '.version' manifest.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # 2) Build firmware with ESPHome
      - name: Build firmware with ESPHome
        run: |
          echo "Building firmware for version: ${{ steps.version.outputs.new_version }}"

          # Adjust this to your actual build command if needed:
          docker run --rm \
            -v "$PWD:/config" \
            esphome/esphome:2025.10.4 \
            compile aeroq.yaml

          # ESPHome default outputs (adjust if your paths differ):
          #   .esphome/build/aeroq/.pioenvs/aeroq/firmware-factory.bin  (factory)
          #   .esphome/build/aeroq/.pioenvs/aeroq/firmware.bin          (OTA)

          mkdir -p firmware

          cp .esphome/build/aeroq/.pioenvs/aeroq/firmware.factory.bin \
            "firmware/aeroq-factory-${{ steps.version.outputs.new_version }}.bin"

          cp .esphome/build/aeroq/.pioenvs/aeroq/firmware.ota.bin \
            "firmware/aeroq-ota-${{ steps.version.outputs.new_version }}.bin"

      # 3) Compute MD5 of the OTA file
      - name: Compute OTA MD5
        id: md5
        run: |
          OTA_FILE="firmware/aeroq-ota-${{ steps.version.outputs.new_version }}.bin"
          MD5=$(md5sum "$OTA_FILE" | awk '{print $1}')
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"

      # 4) Update manifest.json and ota-manifest.json
      - name: Update manifests
        run: |
          OLD="${{ steps.version.outputs.old_version }}"
          NEW="${{ steps.version.outputs.new_version }}"
          MD5="${{ steps.md5.outputs.md5 }}"

          python - << 'PY'
          import json, os, pathlib

          old = os.environ["OLD"]
          new = os.environ["NEW"]
          md5 = os.environ["MD5"]

          def update_manifest(path, is_ota):
              p = pathlib.Path(path)
              data = json.loads(p.read_text())

          # bump version
          data["version"] = new

                # update any "parts[].path" that contains the old version string
                for b in data.get("builds", []):
                    for part in b.get("parts", []):
                        if old in part.get("path", ""):
                            part["path"] = part["path"].replace(old, new)

                    if is_ota and "ota" in b:
                        ota = b["ota"]
                        if old in ota.get("path", ""):
                            ota["path"] = ota["path"].replace(old, new)
                        ota["md5"] = md5

                p.write_text(json.dumps(data, indent=2))

            update_manifest("manifest.json", False)
            update_manifest("ota-manifest.json", True)
            PY
        env:
          OLD: ${{ steps.version.outputs.old_version }}
          NEW: ${{ steps.version.outputs.new_version }}
          MD5: ${{ steps.md5.outputs.md5 }}

      # 5) Commit & push changes back to main
      - name: Commit and push
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add manifest.json ota-manifest.json firmware/
          git commit -m "chore: build firmware ${{ steps.version.outputs.new_version }}" || exit 0
          git push
